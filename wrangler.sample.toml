name = "googlereaderapi"
main = "index.js"
compatibility_date = "2026-09-15"

kv_namespaces = [
  # Used for sync locks + favicon cache
  { binding = "KV", id = "00000000-0000-0000-0000-000000000000" }
]

d1_databases = [
  { binding = "DB", database_name = "googlereaderapi-db", database_id = "00000000-0000-0000-0000-000000000000" }
]

[observability]
enabled = true

[vars]
# Comma-separated users: `username:password`. Change before deploying!
GR_USERS = "admin:changeme123"
# Secret used to sign authentication tokens. Change before deploying!
JWT_SECRET = "change-me-to-a-long-random-string"
# How often (minutes) to refresh feeds via the cron trigger
SYNC_INTERVAL_MIN = 15
# Max feeds processed per cron run (Workers subrequest limit)
MAX_FETCH_PER_CRON = 20
# Max items kept per feed (older items pruned)
MAX_ITEMS_PER_FEED = 3000

[triggers]
crons = ["*/15 * * * *"]